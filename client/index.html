<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo 2</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="container">
    <!-- HEADER DEL SITIO -->
    <header class="header">
      <h1 class="header__title">Gestor de Tareas</h1>
      <p class="header__subtitle">Programacion de Software</p>
    </header>

    <!-- BLOQUE 1: BÚSQUEDA DE USUARIO -->
    <section class="card form-section">
      <h2 class="card__title">Consultar Usuario</h2>
      <div class="form__group">
        <label for="user-doc" class="form__label">Documento del Usuario</label>
        <input type="text" id="user-doc" class="form__input" placeholder="Ingrese documento para buscar...">
        <span id="search-error" class="form__error"></span>
      </div>
      <button type="button" class="btn btn--primary" id="btn-search">
        <span class="btn__icon">🔍</span> Buscar
      </button>
    </section>

    <!-- BLOQUE 2: REGISTRO DE TAREAS -->
    <section class="card form-section">
      <h2 class="card__title">Registrar Nueva Tarea</h2>
      <form id="task-form">
        <div class="form__group">
          <input type="text" id="task-title" class="form__input" placeholder="Título de la tarea">
          <span id="title-error" class="form__error"></span>
        </div>
        <div class="form__group">
          <textarea id="task-desc" class="form__input form__textarea" placeholder="Descripción de la tarea"></textarea>
          <span id="desc-error" class="form__error"></span>
        </div>
        <div class="form__group">
          <select id="task-status" class="form__input">
            <option value="">Seleccione Estado</option>
            <option value="pendiente">Pendiente</option>
            <option value="en-progreso">En Progreso</option>
            <option value="completada">Completada</option>
          </select>
          <span id="status-error" class="form__error"></span>
        </div>
        <!-- El botón ovalado del esquema -->
        <div class="text-center">
          <button type="submit" class="btn btn--primary btn--oval">
            Guardar Tarea
          </button>
        </div>
      </form>
    </section>

    <!-- BLOQUE 3: RESULTADOS Y TABLA -->
    <section class="messages-section">
      <div class="messages-header">
        <h2 class="messages-header__title">Información del Usuario</h2>
        <span class="messages-header__count" id="task-count">0 Tareas</span>
      </div>

      <!-- Contenedor para mostrar info del usuario o mensaje de "no encontrado" -->
      <div id="user-info-display" class="message-card">
        <div class="message-card__content">
          Esperando consulta de usuario...
        </div>
      </div>

      <!-- Tabla Dinámica -->
      <div class="card">
        <div class="messages-container" id="tasks-table">
          <!-- Aquí se cargarán las tareas dinámicamente -->
          <div class="messages-empty">
            <div class="messages-empty__icon">📋</div>
            <p class="messages-empty__text">No hay tareas registradas</p>
            <p class="messages-empty__subtext">Busque un usuario para ver su listado.</p>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 - Proyecto de Jhon Gelvez || Jhon Falcon || Santiago Orozco</p>
    </footer>
  </div>
  <script src="./app.js" type="module"></script>
</body>

</html>
