<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Tareas - ADSO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <!-- HEADER DEL SITIO -->
    <header class="header">
      <h1 class="header__title">Gestor de Tareas</h1>
      <p class="header__subtitle">Programacion de Software</p>
    </header>

    <!-- BLOQUE 1: BÚSQUEDA DE USUARIO (Basado en la parte superior de image_8ed6a2.png) -->
    <section class="card form-section">
      <h2 class="card__title">Consultar Usuario</h2>
      <div class="form__group">
        <label for="user-doc" class="form__label">Documento del Usuario</label>
        <input type="text" id="user-doc" class="form__input" placeholder="Ingrese documento para buscar...">
        <span id="search-error" class="form__error"></span>
      </div>
      <button type="button" class="btn btn--primary" id="btn-search">
        <span class="btn__icon">🔍</span> Buscar
      </button>
    </section>

  </div>

</body>
</html>
